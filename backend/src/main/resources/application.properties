# Server Configuration
server.port=${PORT:8080}

# Application Identification
spring.application.name=leadzam-backend

# Firebase Configuration
leadzam.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}
leadzam.firebase.default-device-token=${DEFAULT_DEVICE_FCM_TOKEN:}
leadzam.firebase.mock-mode=${FIREBASE_MOCK_MODE:false}

# Logging
logging.level.com.leadzam=INFO
logging.level.org.springframework.web=INFO
